  <script type="text/javascript">
   function getParametroGET(nombre) {
     const params = new URLSearchParams(window.location.search);
     return params.get(nombre);
   }
   
   console.log('🚀 Cargando JS de envío a API...');
   
   const API_BASE_URL = 'http://localhost:5000';
   
   // Función principal para enviar el texto de WEunidades
   async function enviarTexto() {
       console.log('🔍 Iniciando envío a la API...');
   
       // Obtener el input de OpenElement
       const textoInput = document.getElementById('WEunidades');
       const resultsDiv = document.getElementById('WEresults');
       const loadingDiv = document.getElementById('WEloading');
       const errorDiv = document.getElementById('WEerror');
   
       if (!textoInput) {
           console.error('❌ No se encuentra el elemento con id "WEunidades"');
           mostrarError('No se encuentra el campo de texto.');
           return;
       }
   
       const texto = getParametroGET('WEunidades');
       console.log('📝 Texto introducido:', texto);
   
       if (!texto) {
           mostrarError('Introduce algún texto antes de enviar');
           return;
       }
   
       const textoClean = texto.replace(/['"\\]/g, '');
   
       try {
           // Mostrar estado de carga
           if (loadingDiv) {
               loadingDiv.style.display = 'block';
               loadingDiv.textContent = '⏳ Enviando datos a la API...';
           }
           if (resultsDiv) resultsDiv.style.display = 'none';
           if (errorDiv) errorDiv.style.display = 'none';
   
           console.log('🌐 Haciendo petición a la API...');
   
           const apiUrl = API_BASE_URL + '/api/objeto'; // cambia /api/tu-endpoint por el que tengas
   
           console.log('🔗 URL de la API:', apiUrl);
   
           const controller = new AbortController();
           const timeoutId = setTimeout(() => controller.abort(), 20000); // 20 segundos
   
           const response = await fetch(apiUrl, {
               method: 'POST',
               headers: {
                   'Content-Type': 'application/json',
               },
               body: JSON.stringify({ texto: textoClean }),
               signal: controller.signal
           }); // [web:33][web:37][web:49]
   
           clearTimeout(timeoutId);
   
           console.log('📡 Respuesta recibida. Status:', response.status);
   
           const data = await response.json();
           console.log('📊 Datos de la API:', data);
   
           if (response.ok) {
               mostrarResultats(data);
           } else {
               const errorMsg = data.error || 'Error desconocido de la API';
               mostrarError(errorMsg);
           }
   
       } catch (error) {
           console.error('❌ Error de conexión:', error);
   
           let errorMessage = 'Error de conexión con el servidor.';
           if (error.name === 'AbortError') {
               errorMessage = 'Tiempo de espera agotado al conectar con la API.';
           } else if (error.message && error.message.includes('fetch')) {
               errorMessage = 'No se puede conectar con la API. Verifica que esté ejecutándose en http://localhost:5000';
           }
   
           mostrarError(errorMessage);
       } finally {
           if (loadingDiv) loadingDiv.style.display = 'none';
       }
   }
   
   function mostrarResultats(data) {
       console.log('✅ Mostrando resultados...');
   
       const resultsDiv = document.getElementById('WEresults');
   
       if (!resultsDiv) {
           console.error('❌ No se encuentra el elemento con id "WEresults"');
           return;
       }
   
       // Adapta este HTML a lo que devuelva tu API
       const html = '<div class="api-results">' +
           '<h3>Respuesta de la API</h3>' +
           '<pre>' + escapeHtml(JSON.stringify(data, null, 2)) + '</pre>' +
       '</div>';
   
       resultsDiv.innerHTML = html;
       resultsDiv.style.display = 'block';
   
       console.log('✅ Resultados mostrados correctamente');
   }
   
   function mostrarError(message) {
       console.warn('⚠️ Mostrando error:', message);
   
       const errorDiv = document.getElementById('WEerror');
   
       if (errorDiv) {
           errorDiv.innerHTML = '<p style="color: red; padding: 10px; border: 1px solid red; border-radius: 5px;">❌ ' + escapeHtml(message) + '</p>';
           errorDiv.style.display = 'block';
       } else {
           const resultsDiv = document.getElementById('WEresults');
           if (resultsDiv) {
               resultsDiv.innerHTML = '<p style="color: red; padding: 10px; border: 1px solid red; border-radius: 5px;">❌ ' + escapeHtml(message) + '</p>';
               resultsDiv.style.display = 'block';
           } else {
               alert('Error: ' + message);
           }
       }
   }
   
   function escapeHtml(text) {
       const div = document.createElement('div');
       div.textContent = text;
       return div.innerHTML;
   }
   
   // Opcional: probar conexión con la API
   async function provarConnexio() {
       try {
           console.log('🔍 Probando conexión con la API...');
   
           const response = await fetch(API_BASE_URL + '/api/health');
           const data = await response.json();
   
           if (response.ok) {
               console.log('✅ Conexión con la API exitosa:', data);
               return true;
           } else {
               console.error('❌ Error de la API:', data);
               return false;
           }
   
       } catch (error) {
           console.error('❌ Error de conexión:', error);
           mostrarError('No se puede conectar con la API. Verifica que esté ejecutándose en http://localhost:5000');
           return false;
       }
   }
   
   console.log('✅ JavaScript de integración cargado correctamente');
   
   // Llama a enviarTexto cuando quieras (por ejemplo, al hacer clic en un botón)
   window.onload = enviarTexto;
  </script>
