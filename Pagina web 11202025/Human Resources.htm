  <script type="text/javascript">
   function getParametroGET(nombre) {
     const params = new URLSearchParams(window.location.search);
     return params.get(nombre);
   }
   // JavaScript MODIFICADO per OpenElement - Ara mostra salari empleat + cost empresa
   
   console.log('🚀 Carregant JavaScript d\'integració de salaris...');
   
   // Configuració de l'API
   const API_BASE_URL = 'http://localhost:5000';
   
   // Funció principal per buscar salaris
   async function buscarSalari() {
       console.log('🔍 Iniciant cerca de salaris...');
   
       // Obtenir elements del DOM amb IDs d'OpenElement
       const jobTitleInput = document.getElementById('WEjob-title');
       const resultsDiv = document.getElementById('WEresults');
       const loadingDiv = document.getElementById('WEloading');
       const errorDiv = document.getElementById('WEerror');
   
       const jobTitle = getParametroGET('WEjob-title');
       console.log('📝 Feina introduïda:', jobTitle);
       // Validació d'entrada
       if (!jobTitle) {
           mostrarError('Introduce el nombre de un trabajo');
           return;
       }
       const jobTitleClean = jobTitle.replace(/['\"\\\\]/g, '');
   
       try {
           // Mostrar estat de càrrega
           if (loadingDiv) {
               loadingDiv.style.display = 'block';
               loadingDiv.textContent = '⏳ Buscando salarios para: ' + jobTitleClean;
           }
           if (resultsDiv) resultsDiv.style.display = 'none';
           if (errorDiv) errorDiv.style.display = 'none';
   
           console.log('🌐 Fent petició a l\'API...');
   
           // Construir URL amb encoding adequat
           const encodedJobTitle = encodeURIComponent(jobTitleClean);
           const apiUrl = API_BASE_URL + '/api/salary?job_title=' + encodedJobTitle;
   
           console.log('🔗 URL de l\'API:', apiUrl);
   
           // Petició a l'API amb timeout
           const controller = new AbortController();
           const timeoutId = setTimeout(() => controller.abort(), 200000); // 20 segons timeout
   
           const response = await fetch(apiUrl, {
               method: 'GET',
               headers: {
                   'Content-Type': 'application/json',
               },
               signal: controller.signal
           });
   
           clearTimeout(timeoutId);
   
           console.log('📡 Resposta rebuda. Status:', response.status);
   
           const data = await response.json();
           console.log('📊 Dades de l\'API:', data);
   
           if (response.ok && data.success) {
               mostrarResultats(data);
           } else {
               const errorMsg = data.error || 'Error desconocido de la API';
               mostrarError(errorMsg);
           }
   
       } catch (error) {
           console.error('❌ Error de connexió:', error);
   
           let errorMessage = 'Error de connexion con el servidor.';
           if (error.name === 'AbortError') {
               errorMessage = error.message;
           } else if (error.message.includes('fetch')) {
               errorMessage = 'No se puede conectar con la API. Verifica que este ejecutandose en http://localhost:5000';
           }
   
           mostrarError(errorMessage);
       } finally {
           // Ocultar estat de càrrega
           if (loadingDiv) loadingDiv.style.display = 'none';
       }
   }
   
   // Funció per mostrar els resultats MODIFICADA
   function mostrarResultats(data) {
       console.log('✅ Mostrando resultados...');
   
       const resultsDiv = document.getElementById('WEresults');
   
       if (!resultsDiv) {
           console.error('❌ No se encuentra el elemento con id "WEresults"');
           return;
       }
   
       const salaryEmployee = data.salary_employee;
       const companyCost = data.salary_data;
   
       // Crear HTML dels resultats amb salari empleat + cost empresa
       const html = '<div class="salary-results">' +
           '<h3>Resultados para: ' + escapeHtml(data.job_title) + '</h3>' +
           '<div class="salary-info">' +
               '<div class="employee-section" style="border: 1px solid #28a745; padding: 15px; margin-bottom: 15px; border-radius: 5px; background-color: #f8f9fa;">' +
                   '<h4 style="color: #28a745; margin-top: 0;">💼 Salario del Trabajador</h4>' +
                   '<div class="employee-annual">' +
                       '<strong>Salario anual bruto:</strong><br>' +
                       '€' + salaryEmployee.annual_min.toLocaleString() + ' - €' + salaryEmployee.annual_max.toLocaleString() +
                       '<div><small>Promedio anual: €' + salaryEmployee.annual_avg.toLocaleString() + '</small></div>' +
                   '</div>' +
                   '<div class="employee-hourly" style="margin-top: 10px;">' +
                       '<strong>Salario por hora del trabajador:</strong><br>' +
                       '€' + salaryEmployee.hour_min + ' - €' + salaryEmployee.hour_max +
                       '<div><small>Promedio por hora: €' + salaryEmployee.hour_avg + '</small></div>' +
                   '</div>' +
               '</div>' +
               '<div class="company-section" style="border: 1px solid #dc3545; padding: 15px; margin-bottom: 15px; border-radius: 5px; background-color: #fff5f5;">' +
                   '<h4 style="color: #dc3545; margin-top: 0;">🏢 Coste para la Empresa</h4>' +
                   '<div class="company-hourly">' +
                       '<strong>Coste por hora (incluye SS + impuestos):</strong><br>' +
                       '€' + companyCost.minimum + ' - €' + companyCost.maximum +
                       '<div><small>Promedio por hora: €' + companyCost.average + '</small></div>' +
                   '</div>' +
                   '<div class="company-details" style="margin-top: 10px;">' +
                       '<small>Factor de coste: x' + data.company_cost.factor_coste + ' | Horas anuales: ' + data.company_cost.horas_anuales + '</small>' +
                   '</div>' +
               '</div>' +
               '<div class="salary-details" style="text-align: center; color: #666; font-size: 12px;">' +
                   '<small>📍 ' + escapeHtml(data.location) + ' | 📊 Fuente: ' + escapeHtml(data.source) + '</small>' +
               '</div>' +
           '</div>' +
       '</div>';
   
       resultsDiv.innerHTML = html;
       resultsDiv.style.display = 'block';
   
       console.log('✅ Resultats mostrats correctament amb salari empleat i cost empresa');
   }
   
   // Funció per mostrar errors
   function mostrarError(message) {
       console.warn('⚠️ Mostrant error:', message);
   
       const errorDiv = document.getElementById('WEerror');
   
       if (errorDiv) {
           errorDiv.innerHTML = '<p style="color: red; padding: 10px; border: 1px solid red; border-radius: 5px;">❌ ' + escapeHtml(message) + '</p>';
           errorDiv.style.display = 'block';
       } else {
           // Fallback: mostrar a WEresults si no hi ha div d'error
           const resultsDiv = document.getElementById('WEresults');
           if (resultsDiv) {
               resultsDiv.innerHTML = '<p style="color: red; padding: 10px; border: 1px solid red; border-radius: 5px;">❌ ' + escapeHtml(message) + '</p>';
               resultsDiv.style.display = 'block';
           } else {
               alert('Error: ' + message);
           }
       }
   }
   
   // Funció per escapar HTML i evitar problemes
   function escapeHtml(text) {
       const div = document.createElement('div');
       div.textContent = text;
       return div.innerHTML;
   }
   
   // Funció per provar la connexió amb l'API
   async function provarConnexio() {
       try {
           console.log('🔍 Provant connexió amb l\'API...');
   
           const response = await fetch(API_BASE_URL + '/api/health');
           const data = await response.json();
   
           if (response.ok) {
               console.log('✅ Connexió amb l\'API exitosa:', data);
               return true;
           } else {
               console.error('❌ Error de l\'API:', data);
               return false;
           }
       } catch (error) {
           console.error('❌ Error de connexió:', error);
           mostrarError('No es pot connectar amb l\'API. Verifica que estigui executant-se a http://localhost:5000');
           return false;
       }
   }
   
   console.log('✅ JavaScript d\'integració carregat correctament');
   
   window.onload = buscarSalari;
  </script>
